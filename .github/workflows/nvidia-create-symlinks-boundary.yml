name: NVIDIA Create Symlinks Boundary

on:
  push:
    paths:
      - '.github/workflows/nvidia-create-symlinks-boundary.yml'
      - 'fixtures/nvidia/create_symlinks_boundary_test.go'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvidia-create-symlinks-boundary
  cancel-in-progress: true

env:
  NVIDIA_RELEASE: v1.20.0
  NVIDIA_RELEASE_COMMIT: 5505e2f94d9aaa08561490db974ba3cd676af209

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@v5
      - name: Checkout exact released NVIDIA source
        run: git clone --depth 1 --branch "$NVIDIA_RELEASE" https://github.com/NVIDIA/nvidia-container-toolkit.git nvidia-container-toolkit
      - name: Fail closed on release identity
        working-directory: nvidia-container-toolkit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NVIDIA_RELEASE_COMMIT"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Inject isolated boundary controls
        run: cp fixtures/nvidia/create_symlinks_boundary_test.go nvidia-container-toolkit/cmd/nvidia-cdi-hook/create-symlinks/daisy_boundary_test.go
      - name: Run host-boundary controls three times
        working-directory: nvidia-container-toolkit
        run: go test -count=3 -run '^TestDaisyCreateSymlinksBoundary_' ./cmd/nvidia-cdi-hook/create-symlinks
      - name: Run upstream package regression
        working-directory: nvidia-container-toolkit
        run: go test ./cmd/nvidia-cdi-hook/create-symlinks
      - name: Truth marker
        run: |
          echo 'scope=released-v1.20.0-local-ci-only'
          echo 'candidate=cmd/nvidia-cdi-hook/create-symlinks/container-root_linux.go'
          echo 'controls=absolute-relative-parent-symlink-host-write-boundary-plus-normal-control'
          echo 'repeat_count=3'
          echo 'finding=false'
          echo 'submission_unlocked=false'
          echo 'truth=passing controls reject this tested host-write escape hypothesis; they do not prove absence of other vulnerabilities'
