name: Validate 12318

on:
  push:
    branches:
      - fix/malformed-json-12318

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --test src/tests/errorHandler.test.js
