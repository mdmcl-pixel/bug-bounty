name: NVIDIA Update Application Profile Boundary

on:
  push:
    paths:
      - '.github/workflows/nvidia-update-application-profile-boundary.yml'
      - 'fixtures/nvidia/update_application_profile_boundary_test.go'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvidia-update-application-profile-boundary
  cancel-in-progress: true

env:
  NVIDIA_RELEASE: v1.20.0
  NVIDIA_RELEASE_COMMIT: 5505e2f94d9aaa08561490db974ba3cd676af209

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Checkout exact released NVIDIA source
        run: git clone --depth 1 --branch "$NVIDIA_RELEASE" https://github.com/NVIDIA/nvidia-container-toolkit.git nvidia-container-toolkit
      - name: Verify release identity
        working-directory: nvidia-container-toolkit
        run: test "$(git rev-parse HEAD)" = "$NVIDIA_RELEASE_COMMIT"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Inject isolated boundary controls
        run: cp fixtures/nvidia/update_application_profile_boundary_test.go nvidia-container-toolkit/cmd/nvidia-cdi-hook/update-application-profile/daisy_boundary_test.go
      - name: Run host-boundary controls three times
        working-directory: nvidia-container-toolkit
        run: go test -count=3 -run '^TestDaisyUpdateApplicationProfileBoundary_' ./cmd/nvidia-cdi-hook/update-application-profile
      - name: Run upstream package regression
        working-directory: nvidia-container-toolkit
        run: go test ./cmd/nvidia-cdi-hook/update-application-profile
      - name: Truth marker
        run: |
          echo 'scope=released-v1.20.0-local-ci-only'
          echo 'candidate=cmd/nvidia-cdi-hook/update-application-profile/update-application-profile.go'
          echo 'controls=application-profile-host-outside-symlink-write-plus-normal-control'
          echo 'repeat_count=3'
          echo 'finding=false'
          echo 'submission_unlocked=false'
          echo 'truth=passing controls reject this tested host-write escape hypothesis; they do not prove absence of other vulnerabilities'
