name: NVIDIA Linux Repro

on:
  push:
    paths:
      - '.github/workflows/nvidia-linux-repro.yml'
      - 'tools/security_evidence_gate.py'
      - 'tools/test_security_evidence_gate.py'
      - 'tools/security_boundary_ranker.py'
      - 'tools/test_security_boundary_ranker.py'
      - 'data/nvidia_public_fix_exclusions.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvidia-linux-repro
  cancel-in-progress: true

env:
  NVIDIA_RELEASE: v1.20.0
  NVIDIA_RELEASE_COMMIT: 5505e2f94d9aaa08561490db974ba3cd676af209

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@v5

      - name: Verify fail-closed research gates
        run: |
          set -euo pipefail
          python -m unittest tools/test_security_evidence_gate.py tools/test_security_boundary_ranker.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/nvidia_public_fix_exclusions.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['target'] == 'NVIDIA/nvidia-container-toolkit'
          assert d['release'] == 'v1.20.0'
          fixes = d.get('public_fixes', [])
          assert len(fixes) >= 4
          assert all(x.get('classification') == 'PUBLIC_FIX_EXCLUDE' for x in fixes)
          assert all(isinstance(x.get('affected_files'), list) and x['affected_files'] for x in fixes)
          assert len({x['commit'] for x in fixes}) == len(fixes)
          PY

      - name: Checkout released NVIDIA Container Toolkit
        run: git clone --depth 1 --branch "$NVIDIA_RELEASE" https://github.com/NVIDIA/nvidia-container-toolkit.git nvidia-container-toolkit

      - name: Fail closed on release identity
        working-directory: nvidia-container-toolkit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$NVIDIA_RELEASE_COMMIT"
          test -z "$(git status --porcelain)"
          printf 'verified_release=%s\nverified_commit=%s\n' "$NVIDIA_RELEASE" "$actual"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Released-code Linux baseline
        working-directory: nvidia-container-toolkit
        run: |
          set -euo pipefail
          go test ./cmd/nvidia-cdi-hook/cudacompat
          go test ./cmd/nvidia-cdi-hook/create-symlinks
          go test ./cmd/nvidia-cdi-hook/disable-device-node-modification
          go test ./cmd/nvidia-cdi-hook/update-application-profile
          go test ./internal/ldconfig
          go vet ./cmd/nvidia-cdi-hook/... ./internal/ldconfig/...

      - name: Repeat critical boundary tests
        working-directory: nvidia-container-toolkit
        run: |
          set -euo pipefail
          go test -count=3 ./cmd/nvidia-cdi-hook/cudacompat
          go test -count=3 ./cmd/nvidia-cdi-hook/create-symlinks
          go test -count=3 ./cmd/nvidia-cdi-hook/disable-device-node-modification
          go test -count=3 ./cmd/nvidia-cdi-hook/update-application-profile
          go test -count=3 ./internal/ldconfig

      - name: Rank adjacent released security boundaries
        run: |
          set -euo pipefail
          python tools/security_boundary_ranker.py nvidia-container-toolkit \
            --limit 20 \
            --exclusions data/nvidia_public_fix_exclusions.json \
            > boundary-ranking.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('boundary-ranking.json', encoding='utf-8'))
          print('### Released v1.20.0 adjacent security-boundary ranking')
          print()
          print('Ranking only; public fixes are reference-only; no vulnerability proof.')
          print()
          for i, item in enumerate(d['candidates'][:20], 1):
              marker = ' public-fix-overlap' if item['public_fix_overlap'] else ''
              print(f"{i}. `{item['path']}` — priority {item['score']} — {item['classification']}{marker}")
          PY

      - name: Reference-only post-release diff triage
        working-directory: nvidia-container-toolkit
        run: |
          set -euo pipefail
          git fetch origin main --depth=120
          {
            echo '### NVIDIA reference-only post-release triage'
            echo
            echo 'These diffs are public reference signals only; unreleased main is never bounty evidence.'
            echo
            echo '#### Security-sensitive changed paths'
            echo '```'
            git diff --name-only HEAD..FETCH_HEAD -- | grep -E '^(cmd/nvidia-cdi-hook/|internal/(ldconfig|modifier|oci)/|pkg/nvcdi/)' || true
            echo '```'
            echo '#### Security-sensitive commits'
            echo '```'
            git log --oneline --no-merges HEAD..FETCH_HEAD -- cmd/nvidia-cdi-hook internal/ldconfig internal/modifier internal/oci pkg/nvcdi | sed -n '1,80p' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Truth marker
        run: |
          printf '%s\n' \
            "release=$NVIDIA_RELEASE" \
            "release_commit=$NVIDIA_RELEASE_COMMIT" \
            'environment=ubuntu-latest' \
            'scope=local-ci-only' \
            'repeat_count=3' \
            'evidence_gate=fail-closed' \
            'public_fix_exclusion=file-aware' \
            'adjacent_boundary_search=enabled' \
            'boundary_ranker=ranking-only' \
            'submission_unlocked=false' \
            'truth=baseline success, ranking, and public diff signals are not vulnerability proof'
